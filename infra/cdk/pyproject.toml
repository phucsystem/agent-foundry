[project]
name = "agent-foundry-cdk"
version = "0.1.0"
description = "AWS CDK infrastructure for Agent Foundry"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.180.0",
    "constructs>=10.0.0",
    "aws-cdk.aws-bedrock-agentcore-alpha>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
