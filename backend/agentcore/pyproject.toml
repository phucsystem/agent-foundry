[project]
name = "agent-foundry-content-editor"
version = "0.1.0"
description = "Content Editor agent for Agent Foundry — runs on AWS AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.4.0",
    "crewai>=0.80,<1.0",
    "crewai-tools>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[all]>=5.0",
    "bedrock-agentcore-starter-toolkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
