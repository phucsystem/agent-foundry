[project]
name = "agent-foundry"
version = "0.1.0"
description = "AI agent platform — build and hire specialised agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "crewai>=0.80",
    "langgraph>=1.0",
    "litellm>=1.50",
    "anthropic>=0.40",
    "celery[redis]>=5.4",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "neo4j>=5.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langfuse>=2.50",
    "langchain-mcp-adapters>=0.1",
    "playwright>=1.45",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
