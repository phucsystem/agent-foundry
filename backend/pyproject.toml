[project]
name = "agent-foundry"
version = "0.1.0"
description = "AI agent platform — build and hire specialised agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "pyyaml>=6.0",
    "asyncpg>=0.31",
    "langfuse>=2.50,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.15",
    "mypy>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
