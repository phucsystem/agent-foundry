<!--
  Screen: S-03 Create Task
  CJX Stage: usage
  FR Mapping: REQ-4.3
  Route: /tasks/create
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Define Your Task - Agent Foundry</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="cjx-usage">
  <div class="app-layout">
    <nav class="sidebar hide-mobile">
      <a href="#" class="sidebar-logo">Agent Foundry</a>
      <ul class="sidebar-nav">
        <li><a href="s01-agent-marketplace.html" class="sidebar-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Marketplace
        </a></li>
        <li><a href="s07-hired-agents.html" class="sidebar-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          My Team
        </a></li>
        <li><a href="s04-task-monitor.html" class="sidebar-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Tasks
        </a></li>
        <li><a href="s06-billing-dashboard.html" class="sidebar-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Billing
        </a></li>
      </ul>
      <button class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-toggle-icon"></span>
        <span class="theme-toggle-label">Dark Mode</span>
      </button>
    </nav>

    <main class="main-content" data-cjx-entrance>
      <div class="page-header">
        <h1 class="page-title">Create Task</h1>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 320px; gap: var(--space-lg); align-items: start;">
        <!-- Left: Form -->
        <div>
          <!-- Name & Goal -->
          <div class="card mb-lg">
            <div class="form-field">
              <label class="form-label" for="task-name">Task Name</label>
              <input class="form-input" id="task-name" type="text" placeholder="e.g., Login flow unit tests">
            </div>
            <div class="form-field" style="margin-bottom: 0;">
              <label class="form-label" for="task-goal">Description</label>
              <textarea class="form-textarea" id="task-goal" placeholder="What should the agent do? Be specific about the expected output." style="min-height: 80px;"></textarea>
            </div>
          </div>

          <!-- Context -->
          <div class="card mb-lg">
            <label class="form-label mb-sm" style="display: block;">Context Files</label>
            <div class="drop-zone" style="padding: var(--space-lg);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto var(--space-xs);">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <p class="text-sm text-muted">Drop files here — PDF, MD, TXT (max 10MB)</p>
            </div>
          </div>

          <!-- Agent Selection -->
          <div class="card mb-lg">
            <label class="form-label mb-sm" style="display: block;">Agent</label>
            <div style="display: flex; gap: var(--space-sm);">
              <label style="flex: 1; cursor: pointer; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border: 2px solid var(--color-primary); border-radius: var(--radius-md); background: rgba(59, 130, 246, 0.04);">
                <input type="radio" name="agent" checked style="display: none;">
                <div class="avatar avatar-sm" style="background: linear-gradient(135deg, #3B82F6, #2563EB); width: 28px; height: 28px; font-size: 11px;">C</div>
                <div>
                  <strong class="text-sm">Coder</strong>
                  <p class="text-xs text-muted" style="margin: 0;">Code, bugs, PRs</p>
                </div>
              </label>
              <label style="flex: 1; cursor: pointer; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <input type="radio" name="agent" style="display: none;">
                <div class="avatar avatar-sm" style="background: linear-gradient(135deg, #10B981, #059669); width: 28px; height: 28px; font-size: 11px;">R</div>
                <div>
                  <strong class="text-sm">Research</strong>
                  <p class="text-xs text-muted" style="margin: 0;">Topics, reports</p>
                </div>
              </label>
              <label style="flex: 1; cursor: pointer; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <input type="radio" name="agent" style="display: none;">
                <div class="avatar avatar-sm" style="background: linear-gradient(135deg, #F59E0B, #D97706); width: 28px; height: 28px; font-size: 11px;">PM</div>
                <div>
                  <strong class="text-sm">PM</strong>
                  <p class="text-xs text-muted" style="margin: 0;">PRDs, backlog</p>
                </div>
              </label>
            </div>
          </div>

          <!-- Budget -->
          <div class="card">
            <label class="form-label mb-sm" style="display: block;">Budget Cap</label>
            <div style="display: flex; align-items: center; gap: var(--space-md);">
              <input type="range" class="budget-slider" id="budget-slider" min="10" max="500" value="50" style="flex: 1;">
              <span style="font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); min-width: 60px; text-align: right;">$50</span>
            </div>
            <div class="budget-range" style="margin-top: var(--space-xs);">
              <span>$10</span>
              <span>$500</span>
            </div>
          </div>
        </div>

        <!-- Right: Summary -->
        <div class="card" style="position: sticky; top: var(--space-lg);">
          <h3 style="font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-md);">Summary</h3>
          <div style="display: flex; flex-direction: column; gap: var(--space-md); font-size: var(--text-sm);">
            <div>
              <span class="text-muted">Goal</span>
              <p style="margin-top: 2px;">Write unit tests for login flow</p>
            </div>
            <div>
              <span class="text-muted">Context</span>
              <p style="margin-top: 2px;">auth-module.md (24KB)</p>
            </div>
            <div>
              <span class="text-muted">Agent</span>
              <div class="flex items-center gap-sm" style="margin-top: 4px;">
                <div class="avatar avatar-sm" style="background: linear-gradient(135deg, #3B82F6, #2563EB); width: 24px; height: 24px; font-size: 10px;">C</div>
                <span>Coder</span>
              </div>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span class="text-muted">Est. Cost</span>
              <span class="font-semibold">~$3.50</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span class="text-muted">Budget Cap</span>
              <span class="font-semibold">$50.00</span>
            </div>
          </div>
          <div style="border-top: 1px solid var(--color-border); margin-top: var(--space-md); padding-top: var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm);">
            <button class="btn btn-primary" style="width: 100%;" onclick="window.location='s04-task-monitor.html'">Submit Task</button>
            <button class="btn btn-secondary" style="width: 100%;">Save Draft</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="interactions.js"></script>
</body>
</html>
