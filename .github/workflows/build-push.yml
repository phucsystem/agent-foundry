name: Build & Push
on:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        if: env.ACR_LOGIN_SERVER != ''
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ secrets.ACR_LOGIN_SERVER != '' }}
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/agent-foundry-api:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/agent-foundry-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        if: env.ACR_LOGIN_SERVER != ''
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ secrets.ACR_LOGIN_SERVER != '' }}
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/agent-foundry-frontend:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/agent-foundry-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
